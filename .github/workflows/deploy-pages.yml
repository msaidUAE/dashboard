name: Sync KPI data and deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize latest KPI CSV files
        shell: pwsh
        env:
          KPI_CSV_SOURCE_ROOT: ${{ vars.KPI_CSV_SOURCE_ROOT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KPI_CSV_SOURCE_ROOT)) {
            throw "Configure the repository Actions variable KPI_CSV_SOURCE_ROOT."
          }

          $sourceRoot = $env:KPI_CSV_SOURCE_ROOT
          $relativePaths = @(
            'Input\complete_KPIs_Analysis.csv',
            'public\Input\complete_KPIs_Analysis.csv'
          )
          $sourcePaths = $relativePaths | ForEach-Object {
            Join-Path $sourceRoot $_
          }
          foreach ($sourcePath in $sourcePaths) {
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "Required KPI CSV is missing: $sourcePath"
            }
          }

          $sourceHash = (Get-FileHash -LiteralPath $sourcePaths[0] -Algorithm SHA256).Hash
          $servedHash = (Get-FileHash -LiteralPath $sourcePaths[1] -Algorithm SHA256).Hash
          if ($sourceHash -ne $servedHash) {
            throw "The source and served KPI CSV copies differ; refusing to publish."
          }

          $rows = Import-Csv -LiteralPath $sourcePaths[0]
          if (-not $rows -or -not (@($rows[0].PSObject.Properties.Name) -contains 'Target') -or
              -not (@($rows[0].PSObject.Properties.Name) -contains 'Pass_Fail')) {
            throw "The KPI CSV is empty or missing Target/Pass_Fail columns."
          }

          foreach ($index in 0..1) {
            $destination = Join-Path $env:GITHUB_WORKSPACE $relativePaths[$index]
            $destinationDirectory = Split-Path -Parent $destination
            New-Item -ItemType Directory -Force -Path $destinationDirectory | Out-Null
            Copy-Item -LiteralPath $sourcePaths[$index] -Destination $destination -Force
          }

      - name: Commit and push changed KPI CSV files
        shell: pwsh
        run: |
          git add -- Input/complete_KPIs_Analysis.csv public/Input/complete_KPIs_Analysis.csv
          git diff --cached --quiet -- Input/complete_KPIs_Analysis.csv public/Input/complete_KPIs_Analysis.csv
          if ($LASTEXITCODE -eq 1) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(data): refresh dashboard KPI snapshot"
            if ($LASTEXITCODE -ne 0) { throw "Failed to commit the KPI CSV update." }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "Failed to push the KPI CSV update." }
          } elseif ($LASTEXITCODE -ne 0) {
            throw "Could not check staged KPI CSV changes."
          } else {
            Write-Host "KPI CSV files are unchanged; no data commit is needed."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build:pages
        env:
          CI: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
